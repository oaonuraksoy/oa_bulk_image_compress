[package]
name = "img-optimize"
version = "1.0.0"
edition = "2021"
description = "Resimleri otomatik olarak optimize edilmiş WebP formatına dönüştüren CLI aracı"

[dependencies]
image = "0.25"
webp = "0.3"
walkdir = "2"
rayon = "1"
indicatif = "0.17"
colored = "2"
dialoguer = "0.11"
humansize = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
